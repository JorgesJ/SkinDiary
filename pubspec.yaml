name: skin_diary
description: "SkinDiary: seguimiento fotografico de la piel (lunares, manchas, pecas). Uso informativo, sin validez medica."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  camera: ^0.11.0+2
  path_provider: ^2.1.4
  path: ^1.9.0
  shared_preferences: ^2.3.2
  sqflite: ^2.4.0
  permission_handler: ^11.3.1
  intl: ^0.19.0
  image: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
