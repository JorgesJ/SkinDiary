<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="SkinDiary - Lleva un diario del cuidado de tu piel: registra tu rutina, productos, estado de la piel y notas diarias." />
  <meta name="theme-color" content="#e98a8a" />
  <title>SkinDiary · Tu diario de cuidado de la piel</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧴</text></svg>" />
  <link rel="stylesheet" href="styles/main.css" />
</head>
<body>
  <header class="app-header">
    <div class="container header-inner">
      <h1 class="logo"><span aria-hidden="true">🧴</span> SkinDiary</h1>
      <button id="newEntryBtn" class="btn btn-primary" type="button">+ Nueva entrada</button>
    </div>
  </header>

  <main class="container app-main">
    <!-- Resumen / estadísticas -->
    <section class="stats" id="stats" aria-label="Resumen">
      <div class="stat-card">
        <span class="stat-value" id="statTotal">0</span>
        <span class="stat-label">Entradas</span>
      </div>
      <div class="stat-card">
        <span class="stat-value" id="statStreak">0</span>
        <span class="stat-label">Racha (días)</span>
      </div>
      <div class="stat-card">
        <span class="stat-value" id="statAvg">–</span>
        <span class="stat-label">Estado medio</span>
      </div>
      <div class="stat-card">
        <span class="stat-value" id="statLast">–</span>
        <span class="stat-label">Último registro</span>
      </div>
    </section>

    <!-- Controles -->
    <section class="toolbar" aria-label="Filtros">
      <input
        type="search"
        id="searchInput"
        class="input search"
        placeholder="Buscar en notas, productos o etiquetas…"
        aria-label="Buscar entradas"
      />
      <select id="conditionFilter" class="input" aria-label="Filtrar por estado de la piel">
        <option value="">Todos los estados</option>
        <option value="5">Excelente</option>
        <option value="4">Buena</option>
        <option value="3">Normal</option>
        <option value="2">Regular</option>
        <option value="1">Mala</option>
      </select>
    </section>

    <!-- Lista de entradas -->
    <section id="entriesList" class="entries" aria-live="polite"></section>

    <!-- Estado vacío -->
    <div id="emptyState" class="empty-state" hidden>
      <p class="empty-emoji" aria-hidden="true">📔</p>
      <h2>Aún no hay entradas</h2>
      <p>Empieza a registrar el cuidado de tu piel. Pulsa «Nueva entrada» para crear la primera.</p>
      <button class="btn btn-primary" type="button" data-action="open-new">Crear primera entrada</button>
    </div>
  </main>

  <!-- Modal de entrada -->
  <div id="modal" class="modal" hidden>
    <div class="modal-backdrop" data-action="close-modal"></div>
    <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-header">
        <h2 id="modalTitle">Nueva entrada</h2>
        <button class="icon-btn" type="button" data-action="close-modal" aria-label="Cerrar">✕</button>
      </div>

      <form id="entryForm" class="entry-form">
        <input type="hidden" id="entryId" />

        <div class="field">
          <label for="entryDate">Fecha</label>
          <input type="date" id="entryDate" class="input" required />
        </div>

        <div class="field">
          <label for="entryCondition">Estado de la piel</label>
          <div class="condition-picker" id="conditionPicker" role="radiogroup" aria-label="Estado de la piel">
            <button type="button" class="condition-option" data-value="1" title="Mala">😣</button>
            <button type="button" class="condition-option" data-value="2" title="Regular">😕</button>
            <button type="button" class="condition-option" data-value="3" title="Normal">😐</button>
            <button type="button" class="condition-option" data-value="4" title="Buena">🙂</button>
            <button type="button" class="condition-option" data-value="5" title="Excelente">😄</button>
          </div>
          <input type="hidden" id="entryCondition" value="3" />
        </div>

        <div class="field">
          <label for="entryProducts">Productos usados</label>
          <input
            type="text"
            id="entryProducts"
            class="input"
            placeholder="Ej. Limpiador suave, Niacinamida, Protector solar"
          />
          <small class="hint">Separa los productos con comas.</small>
        </div>

        <div class="field">
          <label for="entryTags">Etiquetas</label>
          <input
            type="text"
            id="entryTags"
            class="input"
            placeholder="Ej. brote, sequedad, sol, descanso"
          />
          <small class="hint">Separa las etiquetas con comas.</small>
        </div>

        <div class="field">
          <label for="entryNotes">Notas</label>
          <textarea
            id="entryNotes"
            class="input"
            rows="4"
            placeholder="¿Cómo notas tu piel hoy? Cambios, reacciones, sensaciones…"
          ></textarea>
        </div>

        <div class="field">
          <label for="entryPhoto">Foto (opcional)</label>
          <input type="file" id="entryPhoto" class="input" accept="image/*" />
          <div id="photoPreviewWrap" class="photo-preview" hidden>
            <img id="photoPreview" alt="Vista previa de la foto" />
            <button type="button" class="btn btn-ghost btn-sm" data-action="remove-photo">Quitar foto</button>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" data-action="close-modal">Cancelar</button>
          <button type="submit" class="btn btn-primary">Guardar entrada</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
